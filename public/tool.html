<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ad Script Builder</title>
<style>html,body{margin:0;background:#0d0d0d}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

<style>
:root {
  --bg: #0d0d0d;
  --card: #111111;
  --card-hover: #161616;
  --elevated: #1a1a1a;
  --border: #2a2a2a;
  --border-light: #222222;
  --text: #f0ede8;
  --text-muted: #7a7470;
  --text-secondary: #a09a92;
  --accent: #e8500a;
  --accent-hover: #ff5c0a;
  --accent-dim: rgba(232,80,10,0.12);
  --accent-dim2: rgba(232,80,10,0.2);
  --blue: #4a7aff;
  --blue-dim: rgba(74,122,255,0.12);
  --green: #4a8a4a;
  --green-dim: rgba(74,138,74,0.12);
  --success: #4a8a4a;
  --radius: 10px;
  --radius-sm: 6px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100%;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.topbar-brand .bolt {
  color: var(--accent);
  font-size: 18px;
}

.topbar-sub {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
}

.progress-bar-wrap {
  flex: 1;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.progress-label {
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
}

.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.topbar-reset {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.topbar-reset:hover { color: var(--text); border-color: var(--text-muted); }

/* ── Main content ── */
.main {
  flex: 1;
  padding: 40px 24px 80px;
  max-width: 780px;
  width: 100%;
  margin: 0 auto;
}

.view-header {
  margin-bottom: 32px;
}

.view-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}

.view-title {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  text-wrap: balance;
  margin: 0 0 10px;
}

.view-desc {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 560px;
  line-height: 1.65;
  margin: 0;
}

/* ── Cards ── */
.card-grid {
  display: grid;
  gap: 12px;
}

.card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.card-grid.cols-1 { grid-template-columns: 1fr; }

.sel-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  text-align: left;
  width: 100%;
  font-family: inherit;
  color: var(--text);
}

.sel-card:hover {
  background: var(--card-hover);
  border-color: #3a3a3a;
}

.sel-card.selected {
  background: var(--accent-dim);
  border-color: var(--accent);
}

.sel-card.selected-blue {
  background: var(--blue-dim);
  border-color: var(--blue);
}

.sel-card.selected-green {
  background: var(--green-dim);
  border-color: var(--green);
}

.sel-card .card-emoji {
  font-size: 22px;
  margin-bottom: 10px;
  display: block;
}

.sel-card .card-label {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}

.sel-card .card-tagline {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 8px;
}

.sel-card .card-tagline.blue { color: var(--blue); }
.sel-card .card-tagline.green { color: var(--green); }

.sel-card .card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin: 0;
}

.sel-card .card-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--accent-dim2);
  color: var(--accent);
}

.sel-card .card-badge.blue { background: var(--blue-dim); color: var(--blue); }
.sel-card .card-badge.green { background: var(--green-dim); color: var(--green); }

/* Awareness expandable cards */
.awareness-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s;
  font-family: inherit;
  color: var(--text);
  width: 100%;
  text-align: left;
}

.awareness-card:hover { border-color: #3a3a3a; }
.awareness-card.selected { border-color: var(--accent); }

.awareness-card-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.awareness-level-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}

.awareness-card.selected .awareness-level-badge {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.awareness-card-label {
  font-size: 15px;
  font-weight: 600;
}

.awareness-card-tagline {
  font-size: 13px;
  color: var(--text-secondary);
  margin-left: auto;
  text-align: right;
}

.awareness-card-body {
  padding: 0 20px 18px;
  display: none;
}

.awareness-card.expanded .awareness-card-body,
.awareness-card.selected .awareness-card-body {
  display: block;
}

.awareness-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 4px;
}

.awareness-meta-item {
  background: var(--elevated);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}

.awareness-meta-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.awareness-meta-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.awareness-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 12px;
}

/* ── Setup view ── */
.setup-wrap {
  max-width: 460px;
  margin: 60px auto 0;
  text-align: center;
}

.setup-logo {
  font-size: 40px;
  margin-bottom: 24px;
}

.setup-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}

.setup-sub {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 32px;
  line-height: 1.6;
}

.setup-sub a {
  color: var(--accent);
  text-decoration: none;
}
.setup-sub a:hover { text-decoration: underline; }

.input-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  margin-bottom: 16px;
}

.input-wrap label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}

.text-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.15s;
}

.text-input:focus { border-color: var(--accent); }
.text-input::placeholder { color: var(--text-muted); }

.setup-link {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  display: block;
  margin-top: 12px;
  text-align: center;
}

.setup-link:hover { color: var(--text-secondary); }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  outline: none;
}

.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-primary:disabled { background: #4a2a18; color: #7a5a48; cursor: not-allowed; transform: none; }

.btn-secondary {
  background: var(--elevated);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--card-hover); border-color: #3a3a3a; }

.btn-ghost {
  background: none;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: #444; }

.btn-full { width: 100%; justify-content: center; }

.btn-sm {
  padding: 8px 16px;
  font-size: 13px;
}

/* ── Nav footer ── */
.nav-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border-light);
}

/* ── Build view ── */
.build-progress {
  display: flex;
  gap: 6px;
  margin-bottom: 28px;
}

.build-step-dot {
  height: 3px;
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  transition: background 0.3s;
}

.build-step-dot.done { background: var(--accent); }
.build-step-dot.active { background: rgba(232,80,10,0.5); }

.build-step-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.build-step-card.active { border-color: var(--accent); }
.build-step-card.done { border-color: var(--border); opacity: 0.7; }

.build-step-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.step-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}

.build-step-card.active .step-num {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.build-step-card.done .step-num {
  background: var(--success);
  border-color: var(--success);
  color: white;
}

.step-label {
  font-size: 14px;
  font-weight: 600;
}

.step-check {
  margin-left: auto;
  color: var(--success);
  font-size: 16px;
}

.build-step-body {
  padding: 0 20px 20px;
}

.step-tip {
  background: var(--elevated);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 14px;
}

.step-tip strong { color: var(--accent); }

.step-textarea {
  width: 100%;
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  line-height: 1.6;
  padding: 12px 14px;
  resize: vertical;
  min-height: 90px;
  outline: none;
  transition: border-color 0.15s;
}

.step-textarea:focus { border-color: var(--accent); }
.step-textarea::placeholder { color: var(--text-muted); }

.step-specificity-note {
  font-size: 11px;
  color: var(--accent);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* CTA picker */
.cta-picker {
  margin-top: 12px;
}

.cta-group-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 14px 0 8px;
}

.cta-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cta-opt {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 0.12s;
  line-height: 1.5;
}

.cta-opt:hover { border-color: #3a3a3a; color: var(--text); background: var(--card); }
.cta-opt.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

.cta-or-write {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin: 10px 0;
}

/* ── Hooks view ── */
.hooks-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}

.hook-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
  text-align: left;
  width: 100%;
}

.hook-card:hover { border-color: #3a3a3a; background: var(--card-hover); }
.hook-card.selected { border-color: var(--accent); background: var(--accent-dim); }

.hook-num {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.hook-card.selected .hook-num { color: var(--accent); }

.hook-text {
  font-size: 14px;
  line-height: 1.6;
}

/* ── Result view ── */
.result-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.tag-chip {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 4px 12px;
  border-radius: 99px;
  background: var(--elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}

.tag-chip.orange { background: var(--accent-dim2); border-color: var(--accent); color: var(--accent); }
.tag-chip.blue { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
.tag-chip.green { background: var(--green-dim); border-color: var(--green); color: var(--green); }

.script-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.script-box-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.script-box-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.script-box-body {
  padding: 24px;
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  color: var(--text);
}

.copy-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.copy-btn:hover { color: var(--text); border-color: #444; }
.copy-btn.copied { color: var(--success); border-color: var(--success); }

/* ── Loading ── */
.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  gap: 20px;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-msg {
  font-size: 14px;
  color: var(--text-secondary);
  text-align: center;
}

/* ── Error ── */
.error-box {
  background: rgba(200,50,50,0.1);
  border: 1px solid rgba(200,50,50,0.3);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  color: #ff8080;
  font-size: 13px;
  margin-bottom: 20px;
  line-height: 1.55;
}

/* ── Emotion view ── */
.emotion-examples {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.emotion-pill {
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 13px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s;
  font-family: inherit;
}

.emotion-pill:hover { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }

/* Framework cards */
.framework-section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.framework-section-label::before {
  content: '';
  height: 1px;
  width: 20px;
  background: var(--border);
}

.fw-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
  text-align: left;
  width: 100%;
  position: relative;
}

.fw-card:hover { background: var(--card-hover); border-color: #3a3a3a; }
.fw-card.selected { border-color: var(--accent); background: var(--accent-dim); }
.fw-card.recommended::after {
  content: 'Recommended';
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--accent-dim2);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 99px;
}

.fw-card-label { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.fw-card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

/* ── Responsive ── */
@media (max-width: 620px) {
  .main { padding: 24px 16px 60px; }
  .topbar { padding: 0 16px; }
  .topbar-sub { display: none; }
  .card-grid.cols-3 { grid-template-columns: 1fr; }
  .card-grid.cols-2 { grid-template-columns: 1fr; }
  .awareness-meta { grid-template-columns: 1fr; }
  .view-title { font-size: 22px; }
  .progress-bar-wrap { display: none; }
}

@media (max-width: 420px) {
  .setup-wrap { margin-top: 32px; }
}

/* duration cards compact */
.dur-card { display: flex; flex-direction: column; }
.dur-card .dur-word-count { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
.dur-check { position: absolute; top: 10px; right: 12px; width: 20px; height: 20px; background: var(--accent); color: #fff; border-radius: 50%; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.dur-card .dur-spoken { font-size: 11px; color: var(--text-muted); margin-top: 8px; border-top: 1px solid var(--border-light); padding-top: 8px; }

/* ── Niche form ── */

// The page talks to this site's own /api/generate route, which holds the API key server-side.
async function callAPI(prompt, maxTokens) {
  let res;
  try {
    res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, maxTokens: maxTokens || 1200 })
    });
  } catch (e) {
    throw new Error("Couldn't reach the server. Check your connection and try again.");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Server error ${res.status}. Try again in a moment.`);
  return data.text || "";
}

function parseHooks(text) {
  const hooks = [];
  const parts = text.split(/HOOK\s*\d+\s*:/i).filter(p => p.trim());
  for (const part of parts) {
    const cleaned = part.trim();
    if (cleaned) hooks.push(cleaned);
  }
  // fallback: split by double newlines if parsing fails
  if (hooks.length < 2) {
    return text.split(/\n\n+/).filter(p => p.trim()).slice(0, 3);
  }
  return hooks.slice(0, 3);
}

function viewIndex() {
  return VIEWS.indexOf(state.view);
}

function progressPercent() {
  const idx = viewIndex();
  if (idx < 0) return 0;
  return Math.round((idx / (VIEWS.length - 1)) * 100);
}

function viewLabel() {
  const labels = {
    niche: "Your Niche", mode: "Ad Mode", awareness: "Audience Stage", sophistication: "Market",
    emotion: "Emotion", duration: "Duration", framework: "Framework",
    build: "Build Script", hooks: "Choose Hook", result: "Your Script"
  };
  return labels[state.view] || "";
}

function modeColor(modeId) {
  if (modeId === "direct") return "#e8500a";
  if (modeId === "follower") return "#4a7aff";
  if (modeId === "indirect") return "#4a8a4a";
  return "#e8500a";
}

function modeClass(modeId) {
  if (modeId === "follower") return "selected-blue";
  if (modeId === "indirect") return "selected-green";
  return "selected";
}

function el(tag, attrs, ...children) {
  const elem = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") elem.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(elem.style, v);
      else if (k.startsWith("on")) elem.addEventListener(k.slice(2), v);
      else elem.setAttribute(k, v);
    }
  }
  for (const child of children) {
    if (child == null) continue;
    if (typeof child === "string") elem.appendChild(document.createTextNode(child));
    else if (child instanceof Node) elem.appendChild(child);
  }
  return elem;
}

function html(strings, ...vals) {
  const str = strings.reduce((acc, s, i) => acc + s + (vals[i] != null ? vals[i] : ""), "");
  const div = document.createElement("div");
  div.innerHTML = str;
  return div;
}

// ── Build ──
function renderBuild() {
  const wrap = document.createElement("div");
  const fw = FRAMEWORKS[state.selectedFramework];
  const steps = fw.steps;
  const total = steps.length;
  const current = state.currentStep;

  const header = el("div", { class: "view-header" },
    el("div", { class: "view-eyebrow" }, `${fw.label}`),
    el("h1", { class: "view-title" }, "Build your script"),
    el("p", { class: "view-desc" }, "Fill in each section. Your answers become the raw material — the AI turns this into a polished spoken script.")
  );
  wrap.appendChild(header);

  // Step progress dots
  const dots = el("div", { class: "build-progress" });
  for (let i = 0; i < total; i++) {
    const dot = el("div", { class: "build-step-dot" + (i < current ? " done" : i === current ? " active" : "") });
    dots.appendChild(dot);
  }
  wrap.appendChild(dots);

  if (state.apiError) {
    const errBox = el("div", { class: "error-box" }, state.apiError);
    wrap.appendChild(errBox);
  }

  // Steps
  for (let i = 0; i < total; i++) {
    const step = steps[i];
    const isDone = i < current;
    const isActive = i === current;

    const card = el("div", { class: "build-step-card" + (isActive ? " active" : isDone ? " done" : "") });

    const headerDiv = el("div", { class: "build-step-header" },
      el("div", { class: "step-num" }, isDone ? "✓" : String(i + 1)),
      el("div", { class: "step-label" }, step.label),
      isDone ? el("span", { class: "step-check" }, "") : null
    );

    // Click done steps to go back
    if (isDone) {
      headerDiv.style.cursor = "pointer";
      headerDiv.addEventListener("click", () => { state.currentStep = i; render(); });
    }

    card.appendChild(headerDiv);

    if (isActive) {
      const body = el("div", { class: "build-step-body" });

      if (step.tip) {
        body.appendChild(el("div", { class: "step-tip" }, step.tip));
      }

      // If this is a CTA step with options
      if (step.ctaOptions && CTA_OPTIONS[step.ctaOptions]) {
        const ctaDef = CTA_OPTIONS[step.ctaOptions];
        const picker = el("div", { class: "cta-picker" });
        picker.appendChild(el("div", { style: "font-size:12px;color:var(--text-muted);margin-bottom:12px;" }, ctaDef.note));

        for (const group of ctaDef.groups) {
          picker.appendChild(el("div", { class: "cta-group-label" }, group.heading));
          const opts = el("div", { class: "cta-options" });
          for (const opt of group.options) {
            const btn = document.createElement("button");
            btn.className = "cta-opt" + (state.answers[step.id] === opt ? " selected" : "");
            btn.textContent = opt;
            btn.addEventListener("click", () => {
              state.answers[step.id] = opt;
              ta.value = opt;
              // Re-render picker
              document.querySelectorAll(".cta-opt").forEach(b => {
                b.classList.toggle("selected", b.textContent === opt);
              });
            });
            opts.appendChild(btn);
          }
          picker.appendChild(opts);
        }

        picker.appendChild(el("div", { class: "cta-or-write" }, "— or write your own below —"));
        body.appendChild(picker);
      }

      const ta = document.createElement("textarea");
      ta.className = "step-textarea";
      ta.placeholder = step.placeholder || "";
      ta.value = state.answers[step.id] || "";
      ta.addEventListener("input", () => { state.answers[step.id] = ta.value; });
      body.appendChild(ta);

      if (step.specificity) {
        body.appendChild(el("div", { class: "step-specificity-note" }, "⚡ Specificity is everything here. Use real names, numbers, and outcomes."));
      }

      const isLast = i === total - 1;
      const canProceed = !!(state.answers[step.id] && state.answers[step.id].trim());

      const btnRow = el("div", { style: "display:flex;gap:10px;margin-top:16px;" });

      if (!isLast) {
        const nextBtn = el("button", {
          class: "btn btn-primary btn-sm",
          onclick: () => {
            state.answers[step.id] = ta.value;
            if (!ta.value.trim()) { ta.style.borderColor = "var(--accent)"; ta.focus(); return; }
            state.currentStep = i + 1;
            render();
          }
        }, "Next section →");
        btnRow.appendChild(nextBtn);
      } else {
        const genBtn = el("button", {
          class: "btn btn-primary btn-sm" + (state.loading ? " loading" : ""),
          onclick: async () => {
            state.answers[step.id] = ta.value;
            if (!ta.value.trim()) { ta.style.borderColor = "var(--accent)"; ta.focus(); return; }
            await generateHooks();
          }
        }, state.loading ? "Generating..." : "Generate Hooks →");
        if (state.loading) genBtn.disabled = true;
        btnRow.appendChild(genBtn);
      }

      body.appendChild(btnRow);
      card.appendChild(body);
    } else if (isDone && state.answers[step.id]) {
      const preview = el("div", { style: "padding:0 20px 14px;font-size:12px;color:var(--text-muted);font-style:italic;line-height:1.5;" },
        state.answers[step.id].length > 120 ? state.answers[step.id].slice(0, 120) + "…" : state.answers[step.id]
      );
      card.appendChild(preview);
    }

    wrap.appendChild(card);
  }

  if (state.loading) {
    const loadWrap = el("div", { class: "loading-wrap" },
      el("div", { class: "spinner" }),
      el("div", { class: "loading-msg" }, state.loadingMessage || "Writing your hooks...")
    );
    wrap.appendChild(loadWrap);
  }

  const footer = el("div", { class: "nav-footer" },
    el("button", { class: "btn btn-ghost", onclick: () => { state.view = "framework"; render(); } }, "← Back"),
    el("span", {})
  );
  wrap.appendChild(footer);

  return wrap;
}

// ── Hooks ──
function renderHooks() {
  const wrap = document.createElement("div");

  const header = el("div", { class: "view-header" },
    el("div", { class: "view-eyebrow" }, "Choose your hook"),
    el("h1", { class: "view-title" }, "Three hooks. Pick one."),
    el("p", { class: "view-desc" }, "Your hook is the first 2–3 seconds. It determines whether anyone watches the rest. Pick the one that hits hardest.")

  }

      regenBtn
    ),
    state.selectedHook
      ? el("button", { class: "btn btn-primary", onclick: () => generateScript() }, "Generate Full Script →")
      : el("button", { class: "btn btn-primary", disabled: "" }, "Select a hook →")
  );
  wrap.appendChild(footer);

  return wrap;
}

// ── Result ──
function renderResult() {
  const wrap = document.createElement("div");

  const mode = AD_MODES[state.adMode];
  const stage = AWARENESS_STAGES.find(s => s.id === state.awarenessStage);
  const soph = SOPHISTICATION_LEVELS.find(s => s.id === state.sophistication);
  const fw = FRAMEWORKS[state.selectedFramework];

  // Sorted durations in AD_DURATIONS order
  const selectedDurs = AD_DURATIONS.filter(d => state.adDurations.includes(d.id));

  const header = el("div", { class: "view-header" },
    el("div", { class: "view-eyebrow" }, "Your ad script" + (selectedDurs.length > 1 ? "s" : "")),
    el("h1", { class: "view-title" }, "Ready to record."),
    el("p", { class: "view-desc" }, "These are spoken-word video scripts. Read them out loud before you record to hear how they flow.")
  );
  wrap.appendChild(header);

  const meta = el("div", { class: "result-meta" });
  const chips = [
    { text: mode.label, cls: state.adMode === "follower" ? "blue" : state.adMode === "indirect" ? "green" : "orange" },
    { text: stage.label },
    { text: soph.label },
    { text: fw.label }
  ];
  for (const chip of chips) {
    meta.appendChild(el("div", { class: "tag-chip" + (chip.cls ? " " + chip.cls : "") }, chip.text));
  }
  wrap.appendChild(meta);

  if (state.loading) {
    wrap.appendChild(el("div", { class: "loading-wrap" },
      el("div", { class: "spinner" }),
      el("div", { class: "loading-msg" }, state.loadingMessage || "Writing your scripts...")
    ));
    return wrap;
  }

  if (state.apiError) {
    wrap.appendChild(el("div", { class: "error-box" }, state.apiError));
    wrap.appendChild(el("button", { class: "btn btn-primary", onclick: () => generateScript() }, "Try again"));
    return wrap;
  }

  // Duration tabs (only shown when multiple durations selected)
  if (selectedDurs.length > 1) {
    const tabBar = el("div", { style: "display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;" });
    for (const dur of selectedDurs) {
      const isActive = state.activeDurationTab === dur.id;
      const tab = el("button", {
        style: `padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid ${isActive ? "var(--accent)" : "var(--border)"};background:${isActive ? "var(--accent)" : "transparent"};color:${isActive ? "#fff" : "var(--text-secondary)"};transition:all .15s;`
      }, dur.label);
      tab.addEventListener("click", () => { state.activeDurationTab = dur.id; state.copied = false; render(); });
      tabBar.appendChild(tab);
    }
    wrap.appendChild(tabBar);
  }

  const activeDurId = state.activeDurationTab || selectedDurs[0]?.id;
  const activeDur = AD_DURATIONS.find(d => d.id === activeDurId);
  const history = state.scriptHistory[activeDurId] || [];
  const versionIdx = state.activeVersion[activeDurId] || 0;
  const version = history[versionIdx] || { label: "Original", text: state.generatedScripts[activeDurId] || "", captions: [] };
  const activeScript = version.text;
  const busy = !!state.refineLoading[activeDurId];

  // Version pills (shown once there is more than one version)
  if (history.length > 1) {
    const vbar = el("div", { class: "version-bar" }, el("span", { class: "version-label" }, "Versions"));
    history.forEach((v, i) => {
      const pill = el("button", { class: "version-pill" + (i === versionIdx ? " active" : "") }, `v${i + 1} ${v.label}`);
      pill.addEventListener("click", () => { state.activeVersion[activeDurId] = i; state.generatedScripts[activeDurId] = history[i].text; render(); });
      vbar.appendChild(pill);
    });
    wrap.appendChild(vbar);
  }

  const scriptBox = el("div", { class: "script-box" });
  scriptBox.appendChild(el("div", { class: "script-box-header" },
    el("div", { class: "script-box-title" }, fw.label + (activeDur ? " · " + activeDur.label : "") + (history.length > 1 ? " · v" + (versionIdx + 1) : "")),
    makeCopyBtn(activeScript, "Copy script")
  ));

  if (busy) {
    scriptBox.appendChild(el("div", { class: "loading-wrap", style: "min-height:160px;" },
      el("div", { class: "spinner" }),
      el("div", { class: "loading-msg" }, "Rewriting script and captions...")
    ));
  } else {
    scriptBox.appendChild(el("div", { class: "script-box-body" }, activeScript));
  }
  wrap.appendChild(scriptBox);

  // Captions / primary text
  if (!busy) {
    const capWrap = el("div", { class: "captions-wrap" });
    const capHeader = el("div", { class: "captions-header" },
      el("div", {},
        el("div", { class: "script-box-title" }, "Primary text · 3 options"),
        el("div", { class: "captions-sub" }, "The caption above the video. Pick one, or test all three.")
      )
    );
    capWrap.appendChild(capHeader);
    const caps = version.captions || [];
    if (caps.length === 0) {
      capWrap.appendChild(el("div", { class: "captions-empty" },
        el("span", {}, "Captions didn't come through for this version. "),
        el("button", { class: "btn btn-ghost btn-sm", onclick: () => regenerateCaptions(activeDurId) }, "Generate captions")
      ));
    } else {
      const names = ["Short", "Medium", "Long"];
      caps.forEach((c, i) => {
        capWrap.appendChild(el("div", { class: "caption-card" },
          el("div", { class: "caption-card-header" },
            el("span", { class: "caption-num" }, `${i + 1} · ${names[i] || "Option"}`),
            makeCopyBtn(c, "Copy")
          ),
          el("div", { class: "caption-text" }, c)
        ));
      });
    }
    wrap.appendChild(capWrap);
  }

  // Refine panel
  const refine = el("div", { class: "refine-wrap" });
  refine.appendChild(el("div", { class: "script-box-title" }, "Refine this script"));
  refine.appendChild(el("div", { class: "captions-sub", style: "margin-bottom:12px;" }, "Pick an angle, or tell it what to change. Each refinement is saved as a new version."));
  const angleRow = el("div", { class: "angle-row" });
  for (const a of REFINE_ANGLES) {
    const b = el("button", { class: "angle-pill" }, a.label);
    b.disabled = busy;
    b.addEventListener("click", () => refineScript(activeDurId, a.instruction, a.label));
    angleRow.appendChild(b);
  }
  refine.appendChild(angleRow);
  const ta = el("textarea", { class: "niche-textarea", rows: "2", placeholder: "e.g. Make it for people who watched the VSL but didn't book. Lead with the guarantee." });
  ta.value = state.refineText[activeDurId] || "";
  ta.disabled = busy;
  const goBtn = el("button", { class: "btn btn-primary btn-sm", style: "margin-top:10px;" }, "Refine →");
  goBtn.disabled = busy || !ta.value.trim();
  ta.addEventListener("input", () => { state.refineText[activeDurId] = ta.value; goBtn.disabled = busy || !ta.value.trim(); });
  goBtn.addEventListener("click", () => {
    const txt = ta.value.trim();
    if (!txt) return;
    refineScript(activeDurId, txt, "Custom");
  });
  refine.appendChild(ta);
  refine.appendChild(goBtn);
  if (state.refineError[activeDurId]) {
    refine.appendChild(el("div", { class: "error-box", style: "margin-top:12px;margin-bottom:0;" }, state.refineError[activeDurId]));
  }
  wrap.appendChild(refine);

  const hookPreview = el("div", { style: "background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;" },
    el("div", { style: "font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;" }, "Hook used"),
    el("div", { style: "font-size:13px;color:var(--text-secondary);line-height:1.6;font-style:italic;" }, `"${state.selectedHook}"`)
  );
  wrap.appendChild(hookPreview);

  const footer = el("div", { class: "nav-footer" },
    el("div", { style: "display:flex;gap:10px;flex-wrap:wrap;" },
      el("button", { class: "btn btn-ghost btn-sm", onclick: () => { state.view = "hooks"; render(); } }, "← Change hook"),
      el("button", { class: "btn btn-ghost btn-sm", onclick: () => generateScript() }, "↻ Rewrite scripts")
    ),
    el("button", {
      class: "btn btn-primary btn-sm",
      onclick: () => {
        state = { ...state, view: "niche", niche: "", avatar: "", painPoints: "", desiredOutcome: "", adMode: null, awarenessStage: null, sophistication: null, dominantEmotion: "", adDurations: [], selectedFramework: null, currentStep: 0, answers: {}, generatedHooks: [], selectedHook: null, generatedScripts: {}, scriptHistory: {}, activeVersion: {}, refineLoading: {}, refineError: {}, refineText: {}, activeDurationTab: null, loading: false, apiError: "", copied: false };
        render();
      }
    }, "Build another →")
  );
  wrap.appendChild(footer);

  return wrap;
}

// ═══════════════════════════════════════════
// API FLOWS
// ═══════════════════════════════════════════

async function generateHooks() {
  state.loading = true;
  state.loadingMessage = "Writing three hooks for your audience...";
  state.apiError = "";
  state.view = "hooks";
  render();

  try {
    const prompt = buildHookPrompt();
    const text = await callAPI(prompt, 800);
    state.generatedHooks = parseHooks(text);
    state.selectedHook = null;
    state.loading = false;
    render();
  } catch (err) {
    state.loading = false;
    state.apiError = err.message || "Something went wrong. Check your connection and try again.";
    render();
  }
}

async function generateScript() {
  state.loading = true;
  const count = state.adDurations.length;
  state.loadingMessage = count > 1 ? `Writing ${count} scripts and their captions...` : "Writing your script and captions...";
  state.apiError = "";
  state.generatedScripts = {};
  state.scriptHistory = {};
  state.activeVersion = {};
  state.refineError = {};
  state.view = "result";
  render();

  try {
    const results = await Promise.all(
      state.adDurations.map(async durId => {
        const text = (await callAPI(buildScriptPrompt(durId), 1200)).trim();
        let captions = [];
        try { captions = parseCaptions(await callAPI(buildCaptionPrompt(durId, text), 900)); } catch (e) { captions = []; }
        return { durId, text, captions };
      })
    );
    results.forEach(({ durId, text, captions }) => {
      state.generatedScripts[durId] = text;
      state.scriptHistory[durId] = [{ label: "Original", text, captions }];
      state.activeVersion[durId] = 0;
    });
    // Set active tab to first duration in AD_DURATIONS order
    state.activeDurationTab = AD_DURATIONS.map(d => d.id).find(id => state.adDurations.includes(id));
    state.copied = false;
    state.loading = false;
    render();
  } catch (err) {
    state.loading = false;
    state.apiError = err.message || "Something went wrong. Check your connection and try again.";
    render();
  }
}

async function refineScript(durId, instruction, label) {
  const history = state.scriptHistory[durId] || [];
  const current = history[state.activeVersion[durId] || 0];
  if (!current || !instruction.trim()) return;
  state.refineLoading[durId] = true;
  state.refineError[durId] = "";
  render();
  try {
    const text = (await callAPI(buildRefinePrompt(durId, current.text, instruction), 1200)).trim();
    let captions = [];
    try { captions = parseCaptions(await callAPI(buildCaptionPrompt(durId, text), 900)); } catch (e) { captions = []; }
    history.push({ label, text, captions });
    state.scriptHistory[durId] = history;
    state.activeVersion[durId] = history.length - 1;
    state.generatedScripts[durId] = text;
    state.refineText[durId] = "";
    state.refineLoading[durId] = false;
    render();
  } catch (err) {
    state.refineLoading[durId] = false;
    state.refineError[durId] = err.message || "Something went wrong.";
    render();
  }
}

async function regenerateCaptions(durId) {
  const history = state.scriptHistory[durId] || [];
  const idx = state.activeVersion[durId] || 0;
  const current = history[idx];
  if (!current) return;
  state.refineLoading[durId] = true;
  state.refineError[durId] = "";
  render();
  try {
    current.captions = parseCaptions(await callAPI(buildCaptionPrompt(durId, current.text), 900));
    state.refineLoading[durId] = false;
    render();
  } catch (err) {
    state.refineLoading[durId] = false;
    state.refineError[durId] = err.message || "Something went wrong.";
    render();
  }
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════

function makeCopyBtn(text, label) {
  const btn = document.createElement("button");
  btn.className = "copy-btn";
  btn.textContent = label;
  const done = () => {
    btn.className = "copy-btn copied";
    btn.textContent = "✓ Copied";
    setTimeout(() => { btn.className = "copy-btn"; btn.textContent = label; }, 2000);
  };
  btn.addEventListener("click", () => {
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px;top:0;";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  });
  return btn;
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════

render();
</script>
