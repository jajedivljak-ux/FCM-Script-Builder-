<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCM Script Builder</title>
<!-- build: 2026-10-18 v5 retargeting + content ideas + variety -->
<style>html,body{margin:0;background:#0d0d0d}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800&family=Playfair+Display:wght@700&display=swap">

<style>
:root {
  --bg: #0d0d0d;
  --card: #111111;
  --card-hover: #161616;
  --elevated: #1a1a1a;
  --border: #2a2a2a;
  --border-light: #222222;
  --text: #f0ede8;
  --text-muted: #7a7470;
  --text-secondary: #a09a92;
  --accent: #e8500a;
  --accent-hover: #ff5c0a;
  --accent-dim: rgba(232,80,10,0.12);
  --accent-dim2: rgba(232,80,10,0.2);
  --blue: #4a7aff;
  --blue-dim: rgba(74,122,255,0.12);
  --green: #4a8a4a;
  --green-dim: rgba(74,138,74,0.12);
  --purple: #a259ff;
  --purple-dim: rgba(162,89,255,0.12);
  --success: #4a8a4a;
  --radius: 10px;
  --radius-sm: 6px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100%;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.topbar-brand .bolt {
  color: var(--accent);
  font-size: 18px;
}

.topbar-sub {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
}

.progress-bar-wrap {
  flex: 1;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.progress-label {
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
}

.progress-track {
  height: 3px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.topbar-reset {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.topbar-reset:hover { color: var(--text); border-color: var(--text-muted); }

/* ── Main content ── */
.main {
  flex: 1;
  padding: 40px 24px 80px;
  max-width: 780px;
  width: 100%;
  margin: 0 auto;
}

.view-header {
  margin-bottom: 32px;
}

.view-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}

.view-title {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.25;
  text-wrap: balance;
  margin: 0 0 10px;
}

.view-desc {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 560px;
  line-height: 1.65;
  margin: 0;
}

/* ── Cards ── */
.card-grid {
  display: grid;
  gap: 12px;
}

.card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.card-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.card-grid.cols-1 { grid-template-columns: 1fr; }

.sel-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  text-align: left;
  width: 100%;
  font-family: inherit;
  color: var(--text);
}

.sel-card:hover {
  background: var(--card-hover);
  border-color: #3a3a3a;
}

.sel-card.selected {
  background: var(--accent-dim);
  border-color: var(--accent);
}

.sel-card.selected-blue {
  background: var(--blue-dim);
  border-color: var(--blue);
}

.sel-card.selected-green {
  background: var(--green-dim);
  border-color: var(--green);
}

.sel-card.selected-purple {
  background: var(--purple-dim);
  border-color: var(--purple);
}

.sel-card .card-emoji {
  font-size: 22px;
  margin-bottom: 10px;
  display: block;
}

.sel-card .card-label {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
}

.sel-card .card-tagline {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 8px;
}

.sel-card .card-tagline.blue { color: var(--blue); }
.sel-card .card-tagline.green { color: var(--green); }
.sel-card .card-tagline.purple { color: var(--purple); }

.sel-card .card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin: 0;
}

.sel-card .card-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--accent-dim2);
  color: var(--accent);
}

.sel-card .card-badge.blue { background: var(--blue-dim); color: var(--blue); }
.sel-card .card-badge.green { background: var(--green-dim); color: var(--green); }

/* Awareness expandable cards */
.awareness-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s;
  font-family: inherit;
  color: var(--text);
  width: 100%;
  text-align: left;
}

.awareness-card:hover { border-color: #3a3a3a; }
.awareness-card.selected { border-color: var(--accent); }

.awareness-card-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.awareness-level-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}

.awareness-card.selected .awareness-level-badge {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.awareness-card-label {
  font-size: 15px;
  font-weight: 600;
}

.awareness-card-tagline {
  font-size: 13px;
  color: var(--text-secondary);
  margin-left: auto;
  text-align: right;
}

.awareness-card-body {
  padding: 0 20px 18px;
  display: none;
}

.awareness-card.expanded .awareness-card-body,
.awareness-card.selected .awareness-card-body {
  display: block;
}

.awareness-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 4px;
}

.awareness-meta-item {
  background: var(--elevated);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}

.awareness-meta-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.awareness-meta-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.awareness-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 12px;
}

/* ── Setup view ── */
.setup-wrap {
  max-width: 460px;
  margin: 60px auto 0;
  text-align: center;
}

.setup-logo {
  font-size: 40px;
  margin-bottom: 24px;
}

.setup-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}

.setup-sub {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 32px;
  line-height: 1.6;
}

.setup-sub a {
  color: var(--accent);
  text-decoration: none;
}
.setup-sub a:hover { text-decoration: underline; }

.input-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  margin-bottom: 16px;
}

.input-wrap label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}

.text-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  padding: 11px 14px;
  outline: none;
  transition: border-color 0.15s;
}

.text-input:focus { border-color: var(--accent); }
.text-input::placeholder { color: var(--text-muted); }

.setup-link {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  display: block;
  margin-top: 12px;
  text-align: center;
}

.setup-link:hover { color: var(--text-secondary); }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  outline: none;
}

.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-primary:disabled { background: #4a2a18; color: #7a5a48; cursor: not-allowed; transform: none; }

.btn-secondary {
  background: var(--elevated);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--card-hover); border-color: #3a3a3a; }

.btn-ghost {
  background: none;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: #444; }

.btn-full { width: 100%; justify-content: center; }

.btn-sm {
  padding: 8px 16px;
  font-size: 13px;
}

/* ── Nav footer ── */
.nav-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 40px;
  padding-top: 24px;
  border-top: 1px solid var(--border-light);
}

/* ── Build view ── */
.build-progress {
  display: flex;
  gap: 6px;
  margin-bottom: 28px;
}

.build-step-dot {
  height: 3px;
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  transition: background 0.3s;
}

.build-step-dot.done { background: var(--accent); }
.build-step-dot.active { background: rgba(232,80,10,0.5); }

.build-step-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.build-step-card.active { border-color: var(--accent); }
.build-step-card.done { border-color: var(--border); opacity: 0.7; }

.build-step-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.step-num {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
}

.build-step-card.active .step-num {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.build-step-card.done .step-num {
  background: var(--success);
  border-color: var(--success);
  color: white;
}

.step-label {
  font-size: 14px;
  font-weight: 600;
}

.step-check {
  margin-left: auto;
  color: var(--success);
  font-size: 16px;
}

.build-step-body {
  padding: 0 20px 20px;
}

.step-tip {
  background: var(--elevated);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 14px;
}

.step-tip strong { color: var(--accent); }

.step-textarea {
  width: 100%;
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  line-height: 1.6;
  padding: 12px 14px;
  resize: vertical;
  min-height: 90px;
  outline: none;
  transition: border-color 0.15s;
}

.step-textarea:focus { border-color: var(--accent); }
.step-textarea::placeholder { color: var(--text-muted); }

.step-specificity-note {
  font-size: 11px;
  color: var(--accent);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* CTA picker */
.cta-picker {
  margin-top: 12px;
}

.cta-group-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 14px 0 8px;
}

.cta-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cta-opt {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 0.12s;
  line-height: 1.5;
}

.cta-opt:hover { border-color: #3a3a3a; color: var(--text); background: var(--card); }
.cta-opt.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

.cta-or-write {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin: 10px 0;
}

/* ── Hooks view ── */
.hooks-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}

.hook-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
  text-align: left;
  width: 100%;
}

.hook-card:hover { border-color: #3a3a3a; background: var(--card-hover); }
.hook-card.selected { border-color: var(--accent); background: var(--accent-dim); }

.hook-num {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.hook-card.selected .hook-num { color: var(--accent); }

.hook-text {
  font-size: 14px;
  line-height: 1.6;
}

/* ── Result view ── */
.result-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.tag-chip {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 4px 12px;
  border-radius: 99px;
  background: var(--elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}

.tag-chip.orange { background: var(--accent-dim2); border-color: var(--accent); color: var(--accent); }
.tag-chip.blue { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
.tag-chip.green { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.tag-chip.purple { background: var(--purple-dim); border-color: var(--purple); color: var(--purple); }

.script-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.script-box-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.script-box-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.script-box-body {
  padding: 24px;
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  color: var(--text);
}

.copy-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.copy-btn:hover { color: var(--text); border-color: #444; }
.copy-btn.copied { color: var(--success); border-color: var(--success); }

/* ── Loading ── */
.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  gap: 20px;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-msg {
  font-size: 14px;
  color: var(--text-secondary);
  text-align: center;
}

/* ── Error ── */
.error-box {
  background: rgba(200,50,50,0.1);
  border: 1px solid rgba(200,50,50,0.3);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  color: #ff8080;
  font-size: 13px;
  margin-bottom: 20px;
  line-height: 1.55;
}

/* ── Emotion view ── */
.emotion-examples {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}

.emotion-pill {
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 13px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.12s;
  font-family: inherit;
}

.emotion-pill:hover { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }

/* Framework cards */
.framework-section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.framework-section-label::before {
  content: '';
  height: 1px;
  width: 20px;
  background: var(--border);
}

.fw-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
  text-align: left;
  width: 100%;
  position: relative;
}

.fw-card:hover { background: var(--card-hover); border-color: #3a3a3a; }
.fw-card.selected { border-color: var(--accent); background: var(--accent-dim); }
.fw-card.recommended::after {
  content: 'Recommended';
  position: absolute;
  top: 14px;
  right: 14px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--accent-dim2);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 99px;
}

.fw-card-label { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.fw-card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

/* ── Responsive ── */
@media (max-width: 620px) {
  .main { padding: 24px 16px 60px; }
  .topbar { padding: 0 16px; }
  .topbar-sub { display: none; }
  .card-grid.cols-3 { grid-template-columns: 1fr; }
  .card-grid.cols-2 { grid-template-columns: 1fr; }
  .awareness-meta { grid-template-columns: 1fr; }
  .view-title { font-size: 22px; }
  .progress-bar-wrap { display: none; }
}

@media (max-width: 420px) {
  .setup-wrap { margin-top: 32px; }
}

// The page talks to this site's own /api/generate route, which holds the API key server-side.
async function callAPI(prompt, maxTokens) {
  let res;
  try {
    res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Access-Code": accessCode },
      body: JSON.stringify({ prompt, maxTokens: maxTokens || 1200 })
    });
  } catch (e) {
    throw new Error("Couldn't reach the server. Check your connection and try again.");
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    lockOut("Your access code is no longer active. Ask your coach for a new one.");
    throw new Error("Your access code is no longer active.");
  }
  if (!res.ok) throw new Error(data.error || `Server error ${res.status}. Try again in a moment.`);
  return data.text || "";
}

function pickRandom(arr, n) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
  return copy.slice(0, n);
}

// Strip dashes the model sneaks in, and tidy whitespace. Applied to every generated text.
function cleanCopy(text) {
  return String(text || "")
    .replace(/^\s*[-_*=]{2,}\s*$/gm, "")   // separator lines like --- or ***
    .replace(/\s*[-_*=]{3,}\s*$/g, "")     // trailing --- on the last line
    .replace(/\s*[—–]\s*/g, ", ")          // em and en dashes become a comma
    .replace(/\s+-\s+/g, ", ")             // spaced hyphen used as a dash
    .replace(/,\s*,/g, ",")
    .replace(/\s+([,.!?])/g, "$1")
    .replace(/\(,\s*/g, "(")
    .replace(/,\s*\)/g, ")")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function firstSentences(text, max) {
  const parts = text.replace(/\n+/g, " ").match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g) || [text];
  return parts.slice(0, max).join(" ").replace(/\s+/g, " ").trim();
}

function parseHooks(text) {
  const hooks = [];
  const parts = text.split(/HOOK\s*\d+\s*:/i).filter(p => p.trim());
  for (const part of parts) {
    const cleaned = part.trim();
    if (cleaned) hooks.push(cleaned);
  }
  // fallback: split by double newlines if parsing fails
  let out = hooks.length >= 2 ? hooks.slice(0, 3) : text.split(/\n\n+/).filter(p => p.trim()).slice(0, 3);
  // A hook is the opening line only. Trim anything longer to its first two sentences.
  return out.map(h => cleanCopy(firstSentences(h.replace(/^["'\s]+|["'\s]+$/g, ""), 2)));
}

  if (modeId === "follower") return "#4a7aff";
  if (modeId === "indirect") return "#4a8a4a";
  if (modeId === "retarget") return "#a259ff";
  return "#e8500a";

  if (modeId === "follower") return "selected-blue";
  if (modeId === "indirect") return "selected-green";
  if (modeId === "retarget") return "selected-purple";
  return "selected";
}

function el(tag, attrs, ...children) {
  const elem = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") elem.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(elem.style, v);
      else if (k.startsWith("on")) elem.addEventListener(k.slice(2), v);
      else elem.setAttribute(k, v);
    }
  }
  for (const child of children) {
    if (child == null) continue;
    if (typeof child === "string") elem.appendChild(document.createTextNode(child));
    else if (child instanceof Node) elem.appendChild(child);
  }
  return elem;
}

function html(strings, ...vals) {
  const str = strings.reduce((acc, s, i) => acc + s + (vals[i] != null ? vals[i] : ""), "");
  const div = document.createElement("div");
  div.innerHTML = str;
  return div;
}

// ── Build ──
function renderBuild() {
  const wrap = document.createElement("div");
  const fw = FRAMEWORKS[state.selectedFramework];
  const steps = fw.steps;
  const total = steps.length;
  const current = state.currentStep;

  const header = el("div", { class: "view-header" },
    el("div", { class: "view-eyebrow" }, `${fw.label}`),
    el("h1", { class: "view-title" }, "Build your script"),
    el("p", { class: "view-desc" }, "Fill in each section. Your answers become the raw material — the AI turns this into a polished spoken script.")
  );
  wrap.appendChild(header);

  // Step progress dots
  const dots = el("div", { class: "build-progress" });
  for (let i = 0; i < total; i++) {
    const dot = el("div", { class: "build-step-dot" + (i < current ? " done" : i === current ? " active" : "") });
    dots.appendChild(dot);
  }
  wrap.appendChild(dots);

  if (state.apiError) {
    const errBox = el("div", { class: "error-box" }, state.apiError);
    wrap.appendChild(errBox);
  }

  // Steps
  for (let i = 0; i < total; i++) {
    const step = steps[i];
    const isDone = i < current;
    const isActive = i === current;

    const card = el("div", { class: "build-step-card" + (isActive ? " active" : isDone ? " done" : "") });

    const headerDiv = el("div", { class: "build-step-header" },
      el("div", { class: "step-num" }, isDone ? "✓" : String(i + 1)),
      el("div", { class: "step-label" }, step.label),
      isDone ? el("span", { class: "step-check" }, "") : null
    );

    // Click done steps to go back
    if (isDone) {
      headerDiv.style.cursor = "pointer";
      headerDiv.addEventListener("click", () => { state.currentStep = i; render(); });
    }

    card.appendChild(headerDiv);

    if (isActive) {
      const body = el("div", { class: "build-step-body" });

      if (step.tip) {
        body.appendChild(el("div", { class: "step-tip" }, step.tip));
      }

      // If this is a CTA step with options
      if (step.ctaOptions && CTA_OPTIONS[step.ctaOptions]) {
        const ctaDef = CTA_OPTIONS[step.ctaOptions];
        const picker = el("div", { class: "cta-picker" });
        picker.appendChild(el("div", { style: "font-size:12px;color:var(--text-muted);margin-bottom:12px;" }, ctaDef.note));

        for (const group of ctaDef.groups) {
          picker.appendChild(el("div", { class: "cta-group-label" }, group.heading));
          const opts = el("div", { class: "cta-options" });
          for (const opt of group.options) {
            const btn = document.createElement("button");
            btn.className = "cta-opt" + (state.answers[step.id] === opt ? " selected" : "");
            btn.textContent = opt;
            btn.addEventListener("click", () => {
              state.answers[step.id] = opt;
              ta.value = opt;
              // Re-render picker
              document.querySelectorAll(".cta-opt").forEach(b => {
                b.classList.toggle("selected", b.textContent === opt);
              });
            });
            opts.appendChild(btn);
          }
          picker.appendChild(opts);
        }

        picker.appendChild(el("div", { class: "cta-or-write" }, "— or write your own below —"));
        body.appendChild(picker);
      }

      const ta = document.createElement("textarea");
      ta.className = "step-textarea";
      ta.placeholder = step.placeholder || "";
      ta.value = state.answers[step.id] || "";
      ta.addEventListener("input", () => { state.answers[step.id] = ta.value; });
      body.appendChild(ta);

      if (step.specificity) {
        body.appendChild(el("div", { class: "step-specificity-note" }, "⚡ Specificity is everything here. Use real names, numbers, and outcomes."));
      }

      const isLast = i === total - 1;
      const canProceed = !!(state.answers[step.id] && state.answers[step.id].trim());

      const btnRow = el("div", { style: "display:flex;gap:10px;margin-top:16px;" });

      if (!isLast) {
        const nextBtn = el("button", {
          class: "btn btn-primary btn-sm",
          onclick: () => {
            state.answers[step.id] = ta.value;
            if (!ta.value.trim()) { ta.style.borderColor = "var(--accent)"; ta.focus(); return; }
            state.currentStep = i + 1;
            render();
          }
        }, "Next section →");
        btnRow.appendChild(nextBtn);
      } else {
        const genBtn = el("button", {
          class: "btn btn-primary btn-sm" + (state.loading ? " loading" : ""),
          onclick: async () => {
            state.answers[step.id] = ta.value;
            if (!ta.value.trim()) { ta.style.borderColor = "var(--accent)"; ta.focus(); return; }
            await generateHooks();
          }
        }, state.loading ? "Generating..." : "Generate Hooks →");
        if (state.loading) genBtn.disabled = true;
        btnRow.appendChild(genBtn);
      }

      body.appendChild(btnRow);
      card.appendChild(body);
    } else if (isDone && state.answers[step.id]) {
      const preview = el("div", { style: "padding:0 20px 14px;font-size:12px;color:var(--text-muted);font-style:italic;line-height:1.5;" },
        state.answers[step.id].length > 120 ? state.answers[step.id].slice(0, 120) + "…" : state.answers[step.id]
      );
      card.appendChild(preview);
    }

    wrap.appendChild(card);
  }

  if (state.loading) {
    const loadWrap = el("div", { class: "loading-wrap" },
      el("div", { class: "spinner" }),
      el("div", { class: "loading-msg" }, state.loadingMessage || "Writing your hooks...")
    );
    wrap.appendChild(loadWrap);
  }

  const footer = el("div", { class: "nav-footer" },
    el("button", { class: "btn btn-ghost", onclick: () => { state.view = "framework"; render(); } }, "← Back"),
    el("span", {})
  );
  wrap.appendChild(footer);

  return wrap;
}

// ── Hooks ──
function renderHooks() {
  const wrap = document.createElement("div");

  const header = el("div", { class: "view-header" },
    el("div", { class: "view-eyebrow" }, "Choose your hook"),
    el("h1", { class: "view-title" }, "Three hooks. Pick one."),
    el("p", { class: "view-desc" }, "Your hook is the first 2–3 seconds. It determines whether anyone watches the rest. Pick the one that hits hardest.")

      el("div", { class: "spinner" }),

  }

  if (state.apiError) {

    const retry = el("button", { class: "btn btn-primary", onclick: () => generateHooks() }, "Try again");

    return wrap;
  }

  wrap.appendChild(renderAnglePanel());

      el("button", { class: "btn btn-ghost", onclick: () => { state.view = "build"; render(); } }, "← Edit script"),
      regenBtn
    ),
    state.selectedHook
      ? el("button", { class: "btn btn-primary", onclick: () => generateScript() }, "Generate Full Script →")
      : el("button", { class: "btn btn-primary", disabled: "" }, "Select a hook →")
  );
  wrap.appendChild(footer);

  return wrap;

function renderAnglePanel() {
  const panel = el("div", { class: "angle-panel" });
  const batch = state.batchAngles.map(id => HOOK_ANGLES.find(a => a.id === id)).filter(Boolean).map(a => a.label);
  panel.appendChild(el("div", { class: "angle-panel-head" },
    el("div", {},
      el("div", { class: "script-box-title" }, "Angles for the next batch"),
      el("div", { class: "captions-sub" }, batch.length ? "This batch: " + batch.join(" · ") + ". Pick up to three for the next one, or leave it to chance." : "Pick up to three, or leave it to chance.")
    )
  ));
  const row = el("div", { class: "angle-row" });
  for (const a of HOOK_ANGLES) {
    const on = state.angles.includes(a.id);
    const b = el("button", { class: "angle-pill" + (on ? " on" : ""), title: a.instruction }, a.label);
    b.addEventListener("click", () => {
      if (on) state.angles = state.angles.filter(x => x !== a.id);
      else if (state.angles.length < 3) state.angles = state.angles.concat(a.id);
      render();
    });
    row.appendChild(b);
  }
  panel.appendChild(row);
  const ta = el("textarea", { class: "niche-textarea", rows: "2", placeholder: "Optional direction, e.g. lean into the 4am alarm, mention the 2.4km run, speak to dads over 35, no military references this time" });
  ta.value = state.direction;
  ta.addEventListener("input", () => { state.direction = ta.value; });
  panel.appendChild(ta);
  panel.appendChild(el("div", { class: "captions-sub", style: "margin-top:8px;" }, "Direction carries into the scripts too. Hooks you've already generated for this audience are remembered on this device and won't be repeated."));
  return panel;
}

      tabBar.appendChild(tab);
    }
    wrap.appendChild(tabBar);
  }

  const activeDurId = state.activeDurationTab || selectedDurs[0]?.id;
  const activeDur = AD_DURATIONS.find(d => d.id === activeDurId);
  const history = state.scriptHistory[activeDurId] || [];
  const versionIdx = state.activeVersion[activeDurId] || 0;
  const version = history[versionIdx] || { label: "Original", text: state.generatedScripts[activeDurId] || "", captions: [] };
  const activeScript = version.text;
  const busy = !!state.refineLoading[activeDurId];

  // Version pills (shown once there is more than one version)
  if (history.length > 1) {
    const vbar = el("div", { class: "version-bar" }, el("span", { class: "version-label" }, "Versions"));
    history.forEach((v, i) => {
      const pill = el("button", { class: "version-pill" + (i === versionIdx ? " active" : "") }, `v${i + 1} ${v.label}`);

  // Captions / primary text

      ));
    } else {

  // Refine panel
  const refine = el("div", { class: "refine-wrap" });

  const angleRow = el("div", { class: "angle-row" });
  for (const a of REFINE_ANGLES) {

  wrap.appendChild(footer);

  return wrap;
}

async function generateHooks() {
  state.loading = true;
  state.loadingMessage = "Writing three hooks for your audience...";
  state.apiError = "";
  state.view = "hooks";
  // Angles: the user's picks, topped up to three with random ones so no two batches look alike.
  const chosen = state.angles.slice(0, 3);
  const extra = pickRandom(HOOK_ANGLES.map(a => a.id).filter(id => !chosen.includes(id)), 3 - chosen.length);
  state.batchAngles = chosen.concat(extra);
  state.seed = pickRandom(STYLE_SEEDS, 1)[0];
  render();

  try {
    const prompt = buildHookPrompt();
    const text = await callAPI(prompt, 800);
    state.generatedHooks = parseHooks(text);
    rememberHooks(state.generatedHooks);
    state.selectedHook = null;
    state.loading = false;
    render();
  } catch (err) {
    state.loading = false;
    state.apiError = err.message || "Something went wrong. Check your connection and try again.";
    render();
  }
}

async function generateScript() {
  state.loading = true;
  const count = state.adDurations.length;
  state.loadingMessage = count > 1 ? `Writing ${count} scripts and their captions...` : "Writing your script and captions...";
  state.apiError = "";
  state.generatedScripts = {};
  state.scriptHistory = {};
  state.activeVersion = {};
  state.refineError = {};
  state.view = "result";
  render();

  try {
    const results = await Promise.all(
      state.adDurations.map(async durId => {
        const text = cleanCopy(await callAPI(buildScriptPrompt(durId), 1200));
        let captions = [];
        try { captions = parseCaptions(await callAPI(buildCaptionPrompt(durId, text), 900)); } catch (e) { captions = []; }
        return { durId, text, captions };
      })
    );
    results.forEach(({ durId, text, captions }) => {
      state.generatedScripts[durId] = text;
      state.scriptHistory[durId] = [{ label: "Original", text, captions }];
      state.activeVersion[durId] = 0;
    });
    // Set active tab to first duration in AD_DURATIONS order
    state.activeDurationTab = AD_DURATIONS.map(d => d.id).find(id => state.adDurations.includes(id));
    state.copied = false;
    state.loading = false;
    render();
  } catch (err) {
    state.loading = false;
    state.apiError = err.message || "Something went wrong. Check your connection and try again.";
    render();
  }
}

async function refineScript(durId, instruction, label) {
  const history = state.scriptHistory[durId] || [];
  const current = history[state.activeVersion[durId] || 0];
  if (!current || !instruction.trim()) return;
  state.refineLoading[durId] = true;
  state.refineError[durId] = "";
  render();
  try {
    const text = cleanCopy(await callAPI(buildRefinePrompt(durId, current.text, instruction), 1200));
    let captions = [];
    try { captions = parseCaptions(await callAPI(buildCaptionPrompt(durId, text), 900)); } catch (e) { captions = []; }
    history.push({ label, text, captions });
    state.scriptHistory[durId] = history;
    state.activeVersion[durId] = history.length - 1;
    state.generatedScripts[durId] = text;
    state.refineText[durId] = "";
    state.refineLoading[durId] = false;
    render();
  } catch (err) {
    state.refineLoading[durId] = false;
    state.refineError[durId] = err.message || "Something went wrong.";
    render();
  }
}

async function regenerateCaptions(durId) {
  const history = state.scriptHistory[durId] || [];
  const idx = state.activeVersion[durId] || 0;
  const current = history[idx];
  if (!current) return;
  state.refineLoading[durId] = true;
  state.refineError[durId] = "";
  render();
  try {
    current.captions = parseCaptions(await callAPI(buildCaptionPrompt(durId, current.text), 900));
    state.refineLoading[durId] = false;
    render();
  } catch (err) {
    state.refineLoading[durId] = false;
    state.refineError[durId] = err.message || "Something went wrong.";
    render();
  }
}

function makeCopyBtn(text, label) {
  const btn = document.createElement("button");
  btn.className = "copy-btn";
  btn.textContent = label;
  const done = () => {
    btn.className = "copy-btn copied";
    btn.textContent = "✓ Copied";
    setTimeout(() => { btn.className = "copy-btn"; btn.textContent = label; }, 2000);
  };
  btn.addEventListener("click", () => {
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px;top:0;";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  });
  return btn;
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function parseIdeas(text) {
  const start = text.indexOf("[");
  const end = text.lastIndexOf("]");
  if (start === -1 || end <= start) throw new Error("The ideas came back in the wrong format. Try again.");
  let arr;
  try { arr = JSON.parse(text.slice(start, end + 1)); }
  catch (e) { throw new Error("The ideas came back in the wrong format. Try again."); }
  if (!Array.isArray(arr) || !arr.length) throw new Error("No ideas came back. Try again.");
  return arr.filter(i => i && i.hook).map(i => ({
    id: ciNextId++,
    title: cleanCopy(i.title || ""),
    pillar: cleanCopy(i.pillar || ""),
    stage: String(i.stage || "").toUpperCase().slice(0, 3),
    format: cleanCopy(i.format || ""),
    hook: cleanCopy(i.hook),
    angle: cleanCopy(i.angle || ""),
    cta: cleanCopy(i.cta || ""),
    script: "",
    scriptLoading: false,
    scriptError: ""
  }));
}

// BRAND KIT + CAROUSEL BUILDER
// Slides are drawn in the browser. Photos and logos never leave the device.
// ═══════════════════════════════════════════

const SLIDE_W = 1080, SLIDE_H = 1350, SLIDE_PAD = 96;

const BRAND_PRESETS = [
  { id: "dark", label: "Dark + orange", bg: "#111111", text: "#ffffff", primary: "#ff6a1f" },
  { id: "light", label: "White + black", bg: "#ffffff", text: "#111111", primary: "#111111" },
  { id: "navy", label: "Navy + gold", bg: "#0f1b33", text: "#ffffff", primary: "#e7b54a" },
  { id: "cream", label: "Cream + green", bg: "#f4efe6", text: "#1d2a22", primary: "#2f6b4f" },
  { id: "blush", label: "Blush + plum", bg: "#f7e8e4", text: "#2b1a24", primary: "#8a2d5a" },
  { id: "black", label: "Black + lime", bg: "#0b0b0b", text: "#f2f2f2", primary: "#c6f432" }
];

const SLIDE_STYLES = [
  { id: "clean", label: "Clean", head: "Montserrat", headWeight: 800, upper: false, sample: "Clean and modern" },
  { id: "bold", label: "Bold", head: "Bebas Neue", headWeight: 400, upper: true, sample: "BIG AND LOUD" },
  { id: "editorial", label: "Editorial", head: "Playfair Display", headWeight: 700, upper: false, sample: "Classy and calm" },
  { id: "minimal", label: "Minimal", head: "Inter", headWeight: 700, upper: false, sample: "Simple and quiet" }
];

let brand = { handle: "", logo: "", photos: [], preset: "dark", bg: "#111111", text: "#ffffff", primary: "#ff6a1f", style: "clean" };
let brandLoaded = false;

// ── Device storage (IndexedDB holds the images, localStorage is too small) ──
const BrandStore = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open("fcm-brand-kit", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => { this.db = req.result; resolve(this.db); };
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
  },
  async get(key) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const r = db.transaction("kv").objectStore("kv").get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async set(key, val) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
};

let brandSaveTimer = null;
function saveBrand() {
  clearTimeout(brandSaveTimer);
  brandSaveTimer = setTimeout(() => { BrandStore.set("brand", brand).catch(() => {}); }, 250);
}

async function loadBrand() {
  try {
    const saved = await BrandStore.get("brand");
    if (saved) brand = { ...brand, ...saved };
  } catch (e) {}
  brandLoaded = true;
}

function brandIsEmpty() {
  return !brand.logo && !brand.photos.length && !brand.handle;
}

// Shrink uploads so storage stays small and slides draw fast.
function fileToDataURL(file, maxSide, keepAlpha) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(keepAlpha ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That image couldn't be opened. Try a JPG or PNG.")); };
    img.src = url;
  });
}

const imageCache = new Map();
function loadImage(src) {
  if (!src) return Promise.resolve(null);
  if (imageCache.has(src)) return imageCache.get(src);
  const p = new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
  imageCache.set(src, p);
  return p;
}

let fontsReady = null;
function ensureFonts() {
  if (!fontsReady) {
    const loads = [];
    for (const s of SLIDE_STYLES) loads.push(`${s.headWeight} 80px "${s.head}"`);
    loads.push(`400 40px "Inter"`, `600 40px "Inter"`, `700 40px "Inter"`);
    fontsReady = Promise.all(loads.map(f => document.fonts ? document.fonts.load(f).catch(() => {}) : null))
      .then(() => new Promise(r => setTimeout(r, 50)));
  }
  return fontsReady;
}

// ── Drawing helpers ──
function hexToRgb(hex) {
  const h = String(hex || "#000").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function richWords(text, upper) {
  // *word* marks a highlighted word.
  const out = [];
  let hl = false;
  for (let raw of String(text || "").split(/\s+/).filter(Boolean)) {
    if (upper) raw = raw.toUpperCase();
    let on = hl;
    if (raw.startsWith("*")) { on = true; raw = raw.slice(1); hl = true; }
    if (raw.endsWith("*")) { raw = raw.slice(0, -1); hl = false; }
    else if (raw.includes("*")) { raw = raw.replace(/\*/g, ""); hl = false; }
    if (raw) out.push({ w: raw, hl: on });
  }
  return out;
}

function wrapWords(ctx, words, maxW) {
  const lines = [];
  let line = [];
  let width = 0;
  const space = ctx.measureText(" ").width;
  for (const word of words) {
    const ww = ctx.measureText(word.w).width;
    if (line.length && width + space + ww > maxW) {
      lines.push(line); line = []; width = 0;
    }
    width += (line.length ? space : 0) + ww;
    line.push(word);
  }
  if (line.length) lines.push(line);
  return lines;
}

function fitRich(ctx, words, fontFor, maxW, maxH, start, min, lh) {
  let size = start;
  let lines;
  while (true) {
    ctx.font = fontFor(size);
    lines = wrapWords(ctx, words, maxW);
    const tooWide = lines.some(l => ctx.measureText(l.map(w => w.w).join(" ")).width > maxW);
    if ((lines.length * size * lh <= maxH && !tooWide) || size <= min) break;
    size -= 4;
  }
  return { size, lines, height: lines.length * size * lh };
}

function drawRichLines(ctx, fit, x, y, lh, color, hlColor) {
  const space = ctx.measureText(" ").width;
  fit.lines.forEach((line, i) => {
    let cx = x;
    const ly = y + i * fit.size * lh;
    for (const word of line) {
      ctx.fillStyle = word.hl ? hlColor : color;
      ctx.fillText(word.w, cx, ly);
      cx += ctx.measureText(word.w).width + space;
    }
  });
}

function drawCover(ctx, img, x, y, w, h) {
  const s = Math.max(w / img.width, h / img.height);
  const sw = w / s, sh = h / s;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 3, sw, sh, x, y, w, h);
}

function readableOn(bgHex) {
  const [r, g, b] = hexToRgb(bgHex);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111111" : "#ffffff";
}

// Draws one slide onto a 1080x1350 canvas (Instagram portrait size).
async function drawSlide(slide, index, total, kit) {
  await ensureFonts();
  const style = SLIDE_STYLES.find(s => s.id === kit.style) || SLIDE_STYLES[0];
  const c = document.createElement("canvas");
  c.width = SLIDE_W; c.height = SLIDE_H;
  const ctx = c.getContext("2d");
  ctx.textBaseline = "top";
  const isCover = index === 0;
  const isLast = index === total - 1 && total > 1;
  const photo = slide.photo != null && kit.photos[slide.photo] ? await loadImage(kit.photos[slide.photo]) : null;
  const logo = kit.logo ? await loadImage(kit.logo) : null;
  const [br, bgG, bb] = hexToRgb(kit.bg);
  const maxW = SLIDE_W - SLIDE_PAD * 2;
  const headFont = size => `${style.headWeight} ${size}px "${style.head}", "Inter", sans-serif`;
  const bodyFont = size => `400 ${size}px "Inter", sans-serif`;
  const headLH = style.id === "bold" ? 0.98 : 1.12;

  // Background
  ctx.fillStyle = kit.bg;
  ctx.fillRect(0, 0, SLIDE_W, SLIDE_H);

  let textColor = kit.text;
  let onAccent = false;
  let footerTop = SLIDE_H - SLIDE_PAD - 64;

  if (photo && (isCover || isLast)) {
    // Full-bleed photo, fading into the brand background at the bottom.
    drawCover(ctx, photo, 0, 0, SLIDE_W, SLIDE_H);
    const g = ctx.createLinearGradient(0, SLIDE_H * 0.25, 0, SLIDE_H);
    g.addColorStop(0, `rgba(${br},${bgG},${bb},0)`);
    g.addColorStop(0.55, `rgba(${br},${bgG},${bb},0.82)`);
    g.addColorStop(1, `rgba(${br},${bgG},${bb},0.97)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SLIDE_W, SLIDE_H);
  } else if (photo) {
    // Content slide with a photo: photo panel at the top.
    const ph = Math.round(SLIDE_H * 0.42);
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(SLIDE_PAD, SLIDE_PAD + 70, maxW, ph, 28); else ctx.rect(SLIDE_PAD, SLIDE_PAD + 70, maxW, ph);
    ctx.clip();
    drawCover(ctx, photo, SLIDE_PAD, SLIDE_PAD + 70, maxW, ph);
    ctx.restore();
  } else if (isCover && style.id === "bold") {
    ctx.fillStyle = kit.primary;
    ctx.fillRect(0, 0, SLIDE_W, SLIDE_H);
    textColor = readableOn(kit.primary);
    onAccent = true;
  }

  const hlColor = onAccent ? textColor : kit.primary;
  const headWords = richWords(slide.headline, style.upper);
  const bodyText = String(slide.body || "").replace(/\*/g, "");

  // Slide counter
  ctx.font = `600 30px "Inter", sans-serif`;
  ctx.fillStyle = textColor;
  ctx.globalAlpha = 0.6;
  if (!isCover) ctx.fillText(`${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`, SLIDE_PAD, SLIDE_PAD);
  ctx.globalAlpha = 1;

  if (isCover || isLast) {
    // Big text, anchored low on photo slides and centred otherwise.
    const head = fitRich(ctx, headWords, headFont, maxW, isCover ? 620 : 520, isCover ? 132 : 104, 56, headLH);
    let body = null;
    if (bodyText) {
      ctx.font = bodyFont(42);
      body = { lines: wrapWords(ctx, richWords(bodyText), maxW), size: 42 };
    }
    const bodyH = body ? body.lines.length * body.size * 1.4 + 36 : 0;
    const blockH = 34 + head.height + bodyH;
    const top = photo ? footerTop - 60 - blockH : Math.max(SLIDE_PAD + 80, (SLIDE_H - blockH) / 2 - 40);
    ctx.fillStyle = hlColor;
    ctx.fillRect(SLIDE_PAD, top, 90, 12);
    ctx.font = headFont(head.size);
    drawRichLines(ctx, head, SLIDE_PAD, top + 34, headLH, textColor, hlColor);
    if (body) {
      ctx.font = bodyFont(body.size);
      ctx.globalAlpha = 0.88;
      body.lines.forEach((l, i) => { ctx.fillStyle = textColor; ctx.fillText(l.map(w => w.w).join(" "), SLIDE_PAD, top + 34 + head.height + 36 + i * body.size * 1.4); });
      ctx.globalAlpha = 1;
    }
  } else {
    const minTop = photo ? SLIDE_PAD + 70 + Math.round(SLIDE_H * 0.42) + 56 : SLIDE_PAD + 120;
    const avail = footerTop - 50 - minTop;
    const head = fitRich(ctx, headWords, headFont, maxW, Math.min(avail * 0.55, photo ? 300 : 480), photo ? 84 : 108, 48, headLH);
    let body = null;
    if (bodyText) body = fitRich(ctx, richWords(bodyText), bodyFont, maxW, avail - head.height - 44, photo ? 44 : 52, 28, 1.42);
    const blockH = head.height + (body ? 44 + body.height : 0);
    // Text-only slides sit in the visual centre instead of hugging the top.
    const top = photo ? minTop : Math.max(minTop, minTop + (avail - blockH) / 2 - 40);
    ctx.fillStyle = hlColor;
    if (!photo) ctx.fillRect(SLIDE_PAD, top - 40, 70, 10);
    ctx.font = headFont(head.size);
    drawRichLines(ctx, head, SLIDE_PAD, top, headLH, textColor, hlColor);
    if (body) {
      ctx.font = bodyFont(body.size);
      ctx.globalAlpha = 0.85;
      drawRichLines(ctx, body, SLIDE_PAD, top + head.height + 44, 1.42, textColor, textColor);
      ctx.globalAlpha = 1;
    }
  }

  // Footer: logo or handle on the left, swipe cue on the right.
  if (logo) {
    const sc = Math.min(64 / logo.height, 280 / logo.width);
    const dw = logo.width * sc, dh = logo.height * sc;
    ctx.drawImage(logo, SLIDE_PAD, footerTop + (64 - dh) / 2, dw, dh);
  } else if (kit.handle) {
    ctx.font = `600 32px "Inter", sans-serif`;
    ctx.fillStyle = textColor;
    ctx.fillText(kit.handle.startsWith("@") ? kit.handle : "@" + kit.handle, SLIDE_PAD, footerTop + 16);
  }
  if (logo && kit.handle) {
    ctx.font = `600 30px "Inter", sans-serif`;
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.75;
    const h = kit.handle.startsWith("@") ? kit.handle : "@" + kit.handle;
    if (isLast || total === 1) ctx.fillText(h, SLIDE_W - SLIDE_PAD - ctx.measureText(h).width, footerTop + 17);
    ctx.globalAlpha = 1;
  }
  if (!isLast && total > 1) {
    ctx.font = `600 30px "Inter", sans-serif`;
    const t = "Swipe  →";
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.8;
    ctx.fillText(t, SLIDE_W - SLIDE_PAD - ctx.measureText(t).width, footerTop + 17);
    ctx.globalAlpha = 1;
  }
  return c;
}

function canvasToBlob(c, type, q) {
  return new Promise(resolve => c.toBlob(b => resolve(b), type || "image/png", q));
}

// ── Tiny ZIP writer (no compression, PNGs are already compressed) ──
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
    local.setUint16(8, 0, true); local.setUint16(12, 33, true);
    local.setUint32(14, crc, true); local.setUint32(18, f.data.length, true); local.setUint32(22, f.data.length, true);
    local.setUint16(26, name.length, true);
    parts.push(local, name, f.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(14, 33, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, f.data.length, true); cd.setUint32(24, f.data.length, true);
    cd.setUint16(28, name.length, true); cd.setUint32(42, offset, true);
    central.push(cd, name);
    offset += 30 + name.length + f.data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}

function slugify(s) {
  return String(s || "carousel").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "carousel";
}

function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

async function carouselFiles(idea) {
  const car = idea.carousel;
  const files = [];
  for (let i = 0; i < car.slides.length; i++) {
    const c = await drawSlide(car.slides[i], i, car.slides.length, brand);
    const blob = await canvasToBlob(c, "image/png");
    files.push(new File([blob], `slide-${String(i + 1).padStart(2, "0")}.png`, { type: "image/png" }));
  }
  return files;
}

async function downloadCarouselZip(idea, btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Preparing...";
  try {
    const files = await carouselFiles(idea);
    const zipFiles = [];
    for (const f of files) zipFiles.push({ name: f.name, data: new Uint8Array(await f.arrayBuffer()) });
    zipFiles.push({ name: "caption.txt", data: new TextEncoder().encode(idea.carousel.caption || "") });
    downloadBlob(makeZip(zipFiles), slugify(idea.title) + ".zip");
  } catch (e) {
    alert("The download didn't work. Try again.");
  }
  btn.disabled = false; btn.textContent = label;
}

async function shareCarousel(idea, btn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Preparing...";
  try {
    const files = await carouselFiles(idea);
    await navigator.share({ files, title: idea.title });
  } catch (e) {
    if (e && e.name !== "AbortError") alert("Saving didn't work on this device. Use Download instead.");
  }
  btn.disabled = false; btn.textContent = label;
}

function canShareFiles() {
  try {
    return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob(["x"])], "x.png", { type: "image/png" })] }));
  } catch (e) { return false; }
}

// ── AI: write the slides ──
function buildCarouselPrompt(idea) {
  return `You write Instagram carousels for coaches and service businesses. Each slide is read in about 3 seconds, so every slide makes one point.

${ciContext()}

THE IDEA:
- Title: ${idea.title}
- Pillar: ${idea.pillar}
- Funnel stage: ${idea.stage}
- Hook: ${idea.hook}
- Angle: ${idea.angle}
- CTA: ${idea.cta}

TASK: Write a 6 to 8 slide carousel and its caption.

RULES:
- Slide 1 is the cover. Its headline is the hook, tightened to 12 words or fewer. Body is empty or under 10 words.
- Middle slides: one point each. Headline 8 words or fewer. Body 30 words or fewer, plain and specific.
- Last slide is the CTA: headline is the action, body says what they get.
- In every headline, wrap the 1 or 2 most important words in *asterisks* so they can be highlighted.
- Never invent numbers, names or results. Use [their detail] where the creator must fill something in.
- The caption is 3 to 6 short sentences, ends with the CTA, and has no hashtags.

${HUMANIZER_SHORT}

OUTPUT: Return only JSON, no other text:
{"slides": [{"headline": "...", "body": "..."}], "caption": "..."}`;
}

function parseCarousel(text) {
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start === -1 || end <= start) throw new Error("The carousel came back in the wrong format. Try again.");
  let obj;
  try { obj = JSON.parse(text.slice(start, end + 1)); } catch (e) { throw new Error("The carousel came back in the wrong format. Try again."); }
  const slides = (obj.slides || []).filter(s => s && s.headline).slice(0, 10).map(s => ({
    headline: cleanCopy(s.headline),
    body: cleanCopy(s.body || ""),
    photo: null
  }));
  if (slides.length < 2) throw new Error("The carousel came back too short. Try again.");
  return { slides, caption: cleanCopy(obj.caption || "") };
}

function assignPhotos(car) {
  const n = brand.photos.length;
  car.slides.forEach(s => { s.photo = null; });
  if (!n) return;
  car.slides[0].photo = 0;
  if (car.slides.length > 2) car.slides[car.slides.length - 1].photo = n > 1 ? 1 : 0;
  if (n > 2 && car.slides.length > 4) car.slides[Math.floor(car.slides.length / 2)].photo = 2;
}

async function generateCarousel(id) {
  const idea = cstate.ideas.find(i => i.id === id);
  if (!idea) return;
  idea.carouselLoading = true;
  idea.carouselError = "";
  render();
  try {
    const text = await callAPI(buildCarouselPrompt(idea), 2200);
    const car = parseCarousel(text);
    assignPhotos(car);
    idea.carousel = car;
    cstate.carouselSlide = 0;
  } catch (e) {
    idea.carouselError = e.message || "Something went wrong. Try again.";
  }
  idea.carouselLoading = false;
  ciSave();
  render();
}

function openCarousel(id) {
  const idea = cstate.ideas.find(i => i.id === id);
  if (!idea) return;
  cstate.view = "carousel";
  cstate.carouselId = id;
  cstate.carouselSlide = 0;
  render();
  window.scrollTo(0, 0);
  if (!idea.carousel && !idea.carouselLoading) generateCarousel(id);
}

// ── VIEW: Carousel builder ──
function renderCarouselView() {
  const idea = cstate.ideas.find(i => i.id === cstate.carouselId);
  const wrap = document.createElement("div");
  wrap.appendChild(el("button", { class: "btn btn-ghost btn-sm", style: { marginBottom: "20px" }, onclick: () => { cstate.view = "ideas"; render(); } }, "← Back to ideas"));
  if (!idea) { wrap.appendChild(el("div", { class: "ci-empty" }, "That idea isn't there anymore.")); return wrap; }

  wrap.appendChild(el("div", { class: "view-header" },
    el("div", { class: "view-eyebrow" }, "Carousel"),
    el("h1", { class: "view-title" }, idea.title || "Your carousel"),
    el("p", { class: "view-desc" }, idea.hook)
  ));

  if (brandIsEmpty()) {
    wrap.appendChild(el("div", { class: "bk-nudge" },
      el("span", {}, "Add your photos, logo and colours so the slides look like your brand."),
      el("button", { class: "btn btn-secondary btn-sm", onclick: () => { cstate.brandReturn = "carousel"; cstate.view = "brand"; render(); window.scrollTo(0, 0); } }, "Set up brand kit")
    ));
  }

  if (idea.carouselLoading) {
    wrap.appendChild(el("div", { class: "loading-wrap" }, el("div", { class: "spinner" }), el("div", { class: "loading-msg" }, "Writing your slides...")));
    return wrap;
  }
  if (idea.carouselError) {
    wrap.appendChild(el("div", { class: "error-box" }, idea.carouselError));
    wrap.appendChild(el("button", { class: "btn btn-primary", onclick: () => generateCarousel(idea.id) }, "Try again"));
    return wrap;
  }
  const car = idea.carousel;
  if (!car) return wrap;
  const total = car.slides.length;
  if (cstate.carouselSlide >= total) cstate.carouselSlide = total - 1;

  // Slide strip
  const strip = el("div", { class: "car-strip" });
  const thumbs = [];
  car.slides.forEach((s, i) => {
    const img = el("img", { class: "car-thumb" + (i === cstate.carouselSlide ? " active" : ""), alt: `Slide ${i + 1}` });
    img.addEventListener("click", () => { cstate.carouselSlide = i; render(); });
    thumbs.push(img);
    strip.appendChild(el("div", { class: "car-thumb-wrap" }, img, el("span", { class: "car-thumb-num" }, String(i + 1))));
  });
  wrap.appendChild(strip);
  const paint = async i => {
    const c = await drawSlide(car.slides[i], i, total, brand);
    if (thumbs[i]) thumbs[i].src = c.toDataURL("image/jpeg", 0.82);
  };
  (async () => { for (let i = 0; i < total; i++) await paint(i); })();
  setTimeout(() => {
    const w = thumbs[cstate.carouselSlide] && thumbs[cstate.carouselSlide].parentNode;
    if (w) strip.scrollLeft = Math.max(0, w.offsetLeft - strip.offsetLeft - 16);
  }, 0);

  // Editor for the selected slide
  const idx = cstate.carouselSlide;
  const slide = car.slides[idx];
  const ed = el("div", { class: "car-editor" });
  ed.appendChild(el("div", { class: "ci-group-title" }, `Editing slide ${idx + 1} of ${total}`));
  ed.appendChild(el("p", { class: "ci-group-hint" }, "Wrap a word in *stars* to highlight it."));
  let t;
  const repaint = () => { clearTimeout(t); t = setTimeout(() => { paint(idx); ciSave(); }, 250); };
  const hTa = el("textarea", { class: "niche-textarea", rows: "2" });
  hTa.value = slide.headline;
  hTa.addEventListener("input", () => { slide.headline = hTa.value; repaint(); });
  const bTa = el("textarea", { class: "niche-textarea", rows: "3", placeholder: "Body text (optional)" });
  bTa.value = slide.body;
  bTa.addEventListener("input", () => { slide.body = bTa.value; repaint(); });
  ed.appendChild(el("label", { class: "niche-label" }, "Headline"));
  ed.appendChild(hTa);
  ed.appendChild(el("label", { class: "niche-label", style: { marginTop: "12px", display: "block" } }, "Body"));
  ed.appendChild(bTa);

  if (brand.photos.length) {
    ed.appendChild(el("label", { class: "niche-label", style: { marginTop: "14px", display: "block" } }, "Photo on this slide"));
    const row = el("div", { class: "car-photo-row" });
    row.appendChild(el("button", { class: "car-photo-opt car-none" + (slide.photo == null ? " on" : ""), onclick: () => { slide.photo = null; ciSave(); render(); } }, "None"));
    brand.photos.forEach((src, pi) => {
      row.appendChild(el("button", { class: "car-photo-opt" + (slide.photo === pi ? " on" : ""), onclick: () => { slide.photo = pi; ciSave(); render(); } }, el("img", { src, alt: "" })));
    });
    ed.appendChild(row);
  }

  const order = el("div", { class: "ci-actions", style: { marginTop: "14px" } });
  if (idx > 0) order.appendChild(el("button", { class: "copy-btn", onclick: () => { [car.slides[idx - 1], car.slides[idx]] = [car.slides[idx], car.slides[idx - 1]]; cstate.carouselSlide = idx - 1; ciSave(); render(); } }, "← Move left"));
  if (idx < total - 1) order.appendChild(el("button", { class: "copy-btn", onclick: () => { [car.slides[idx + 1], car.slides[idx]] = [car.slides[idx], car.slides[idx + 1]]; cstate.carouselSlide = idx + 1; ciSave(); render(); } }, "Move right →"));
  if (total < 10) order.appendChild(el("button", { class: "copy-btn", onclick: () => { car.slides.splice(idx + 1, 0, { headline: "New *slide*", body: "", photo: null }); cstate.carouselSlide = idx + 1; ciSave(); render(); } }, "+ Add slide"));
  if (total > 2) order.appendChild(el("button", { class: "copy-btn", onclick: () => { car.slides.splice(idx, 1); cstate.carouselSlide = Math.max(0, idx - 1); ciSave(); render(); } }, "Delete slide"));
  ed.appendChild(order);
  wrap.appendChild(ed);

  // Caption
  const capBox = el("div", { class: "script-box", style: { marginTop: "18px" } });
  const capHead = el("div", { class: "script-box-header" }, el("div", { class: "script-box-title" }, "Caption"), makeCopyBtn(car.caption, "Copy caption"));
  const capTa = el("textarea", { class: "niche-textarea car-caption", rows: "6" });
  capTa.value = car.caption;
  capTa.addEventListener("input", () => { car.caption = capTa.value; ciSave(); });
  capBox.appendChild(capHead);
  capBox.appendChild(el("div", { style: { padding: "14px" } }, capTa));
  wrap.appendChild(capBox);

  // Actions
  const actions = el("div", { class: "car-actions" });
  if (canShareFiles()) {
    const shareBtn = el("button", { class: "btn btn-primary btn-full" }, "Save slides to my phone");
    shareBtn.addEventListener("click", () => shareCarousel(idea, shareBtn));
    actions.appendChild(shareBtn);
  }
  const zipBtn = el("button", { class: "btn btn-full " + (canShareFiles() ? "btn-secondary" : "btn-primary") }, "Download all slides (ZIP)");
  zipBtn.addEventListener("click", () => downloadCarouselZip(idea, zipBtn));
  actions.appendChild(zipBtn);
  const one = el("button", { class: "btn btn-ghost btn-full" }, `Download slide ${idx + 1} only`);
  one.addEventListener("click", async () => {
    const c = await drawSlide(car.slides[idx], idx, total, brand);
    downloadBlob(await canvasToBlob(c, "image/png"), `slide-${String(idx + 1).padStart(2, "0")}.png`);
  });
  actions.appendChild(one);
  actions.appendChild(el("div", { class: "car-actions-row" },
    el("button", { class: "btn btn-ghost btn-sm", onclick: () => { cstate.brandReturn = "carousel"; cstate.view = "brand"; render(); window.scrollTo(0, 0); } }, "Edit brand kit"),
    el("button", { class: "btn btn-ghost btn-sm", onclick: () => { if (confirm("Rewrite all slides? Your edits will be replaced.")) generateCarousel(idea.id); } }, "Rewrite slides")
  ));
  wrap.appendChild(actions);
  return wrap;
}

// ACCESS CODE
// ═══════════════════════════════════════════

const ACCESS_KEY = "fcm-access-code";
let accessCode = "";
let gateMessage = "";
try { accessCode = localStorage.getItem(ACCESS_KEY) || ""; } catch (e) {}

function lockOut(msg) {
  accessCode = "";
  gateMessage = msg || "";
  try { localStorage.removeItem(ACCESS_KEY); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}

let gateProbed = false;
function renderGate() {
  const wrap = el("div", { class: "gate-wrap" });
  if (!gateProbed) {
    // If no access codes are configured on the server, the tool is open: skip the gate.
    gateProbed = true;
    fetch("/api/check-code", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: "" }) })
      .then(r => r.json()).then(d => { if (d && d.ok && d.open) { accessCode = "open"; render(); } }).catch(() => {});
  }
  wrap.appendChild(el("div", { class: "gate-logo" }, "⚡"));
  wrap.appendChild(el("h1", { class: "gate-title" }, "FCM Script Builder"));
  wrap.appendChild(el("p", { class: "gate-sub" }, "Enter the access code your coach gave you. You only need to do this once on each device."));
  const input = el("input", { class: "text-input gate-input", placeholder: "FCM-XXXX-XXXX-XXXX", autocomplete: "off", autocapitalize: "characters", spellcheck: "false" });
  const msg = el("div", { class: "gate-msg" }, gateMessage);
  const btn = el("button", { class: "btn btn-primary btn-full" }, "Unlock");
  async function submit() {
    const code = input.value.trim().toUpperCase().replace(/\s+/g, "");
    if (!code) return;
    btn.disabled = true; btn.textContent = "Checking...";
    msg.textContent = "";
    try {
      const res = await fetch("/api/check-code", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        accessCode = code; gateMessage = "";
        try { localStorage.setItem(ACCESS_KEY, code); } catch (e) {}
        render();
        return;
      }
      msg.textContent = data.error || "That code isn't active. Check it and try again.";
    } catch (e) {
      msg.textContent = "Couldn't reach the server. Check your connection and try again.";
    }
    btn.disabled = false; btn.textContent = "Unlock";
  }
  btn.addEventListener("click", submit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  wrap.appendChild(input);
  wrap.appendChild(msg);
  wrap.appendChild(btn);
  setTimeout(() => input.focus(), 0);
  return wrap;
}
